name: Android release

# Store pipeline for the Android shell (apps/mobile). Every release that ships the apps becomes an
# Android build (see "Which releases ship the apps" in docs/store-distribution.md):
#
# workflow_dispatch      -> build the channel web bundle, build + sign the release aab with the
#                           upload key, upload to the Play internal track, then — behind the
#                           `play-store` environment's required-reviewer gate — promote that
#                           build to production at a STAGED 10% rollout (add `[full-rollout]` to
#                           the release notes before approving to go straight to 100%).
#                           dry_run=true stops after the signed bundle (no upload).
#
# deploy.yml dispatches this on `main` with `tag` set to the release it just published, so the
# workflow definition always comes from `main` while the build checks out the tag, which must be
# reachable from `main`. Each credential lives in an environment limited to `main` (see
# "Credential environments" in docs/store-distribution.md), so a dispatch from any other ref,
# dry runs included, is refused.
#
# NOTE: with Managed publishing enabled in Play Console, a green `promote` job means "ready to
# publish", not "live" — the release waits for an explicit publish click in the console.
#
# Google Play re-signs uploads with the escrowed app signing key (Play App Signing); the
# keystore here is the UPLOAD key only.
#
# Requires secrets PLAY_SERVICE_ACCOUNT_JSON, ANDROID_UPLOAD_KEYSTORE (base64 JKS),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD on the `android-build`
# environment; `play-store` holds its own PLAY_SERVICE_ACCOUNT_JSON for promotion. FAILS CLOSED
# if any is missing: Android is a live store channel, so "no credentials" means a release did not
# ship, and that must be red. A green run has to mean the bundle reached Play.

run-name: Android release ${{ inputs.tag || github.ref_name }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to ship (vX.Y.Z, reachable from main); only a dry run may leave it empty
        type: string
        default: ""
      dry_run:
        description: Build + sign only; skip the Play upload
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One lane PER RELEASE, not one lane for all of them. The promote job waits on the play-store
  # environment's reviewer, and a run parked at an environment gate still occupies its concurrency
  # group — so a single group made one unapproved promotion block every later release indefinitely,
  # with the queued runs showing only "pending". Keyed by release tag, an unapproved v1 blocks
  # nothing but another v1. Still never cancels in progress: a signing or store upload must always finish.
  group: android-release-${{ inputs.tag || github.ref }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Play internal track
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Upload key and the upload-only Play account. deployment: false keeps the branch policy and
    # the secrets without recording a deployment for every build.
    environment:
      name: android-build
      deployment: false
    outputs:
      app-version: ${{ steps.version.outputs.version }}
      build-number: ${{ steps.version.outputs.build }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      # Presence check only; values are never printed (passed via env, not interpolated) and the
      # failure names the missing KEYS, never their contents.
      #
      # Fail closed rather than warn and skip: a release run has exactly two honest outcomes, the
      # bundle reached Play or the run is red. Skipping would make an unreleasable repo look green.
      - name: Check Play secrets are configured
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for key in PLAY_SERVICE_ACCOUNT_JSON ANDROID_UPLOAD_KEYSTORE ANDROID_KEYSTORE_PASSWORD \
                     ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!key-}" ] || missing+=("$key")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Android release secrets missing: ${missing[*]}."
            echo "Set them on the android-build environment (see docs/store-distribution.md)."
            exit 1
          fi
          echo "All five Android release secrets are present."

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          fetch-depth: 0 # full tags so a dispatch run can resolve the current version

      # Runs before any repository code meets a credential, and stays inline: a script or local
      # action would be read from the checkout this step is vetting. Later jobs check out the
      # commit recorded here, never the tag, so a tag moved mid-run cannot change what they build.
      - name: Verify the release source is on main
        id: source
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::a release run must name the tag to ship; only a dry run may omit it"; exit 1
          fi
          if [ -n "${TAG:-}" ]; then
            if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::tag input '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1
            fi
            TAGGED="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}")" \
              || { echo "::error::$TAG is not a tag in this repository"; exit 1; }
            [ "$(git rev-parse HEAD)" = "$TAGGED" ] \
              || { echo "::error::checkout does not match $TAG"; exit 1; }
            git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor HEAD refs/remotes/origin/main \
              || { echo "::error::$TAG is not reachable from main — only reviewed commits are released"; exit 1; }
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Google enforces publish rights when an edit is APPLIED, not on the calls that build it, so
      # an under-permissioned service account gets all the way through build + upload + metadata
      # before being refused. Probe it here — seconds, applies nothing — rather than discovering it
      # minutes in with a signed bundle already produced.
      - name: Verify Play publish permission (fail-closed)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/check-play-permission.mjs

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-store-version
        with:
          tag: ${{ inputs.tag }}

      - name: Build web bundle (android channel)
        uses: ./.github/actions/build-web-channel
        with:
          channel: android
          app-version: ${{ steps.version.outputs.version }}
          apple-app-id: ${{ vars.PUBLIC_APPLE_APP_ID }}

      - name: Sync Capacitor Android project
        run: pnpm --filter @how2vote/mobile sync:android

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Ruby / fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version # single source: apps/mobile/.ruby-version
          bundler-cache: true
          working-directory: apps/mobile

      # Listing copy + changelog are generated from the operator + shared product-copy records
      # (single-sourced s 321D authorisation; see scripts/generate-store-metadata.mjs).
      - name: Generate store metadata
        env:
          BUILD_YEAR: ${{ steps.version.outputs.build-year }}
        run: node scripts/generate-store-metadata.mjs

      # Supply reads images from the (generated, gitignored) metadata images dir; the screenshots and
      # feature graphic are staged there by generate-store-metadata above. The store icon is rendered
      # here.
      #
      # The store icon is a DIFFERENT asset from the launcher icon inside the APK: Play shows it in
      # search and on the listing page, and with no icon.png the listing falls back to a generic
      # placeholder. It is rendered here from the same committed 1024px opaque mark the
      # native launcher icons are generated from (assets/icon-only.png via generate-native-assets),
      # so the store and the device can never show different marks.
      - name: Render the Play store icon
        working-directory: apps/mobile
        run: |
          IMG=fastlane/metadata/android/en-AU/images
          # An unstaged pack is invisible at upload time — supply just sends nothing.
          for d in phoneScreenshots tenInchScreenshots; do
            test -n "$(ls -A "$IMG/$d" 2>/dev/null)" \
              || { echo "::error::$IMG/$d is empty — generate-store-metadata did not stage Play's images"; exit 1; }
          done
          test -s "$IMG/featureGraphic.png" \
            || { echo "::error::$IMG/featureGraphic.png missing — generate-store-metadata did not stage it"; exit 1; }
          # assets/ holds gitignored, deterministic intermediates, so the mark does not exist on a
          # fresh checkout — render it first (sharp only; the @capacitor/assets step that needs a
          # toolchain is NOT required just to get the source mark).
          node scripts/generate-native-assets.mjs
          # Play requires exactly 512x512 (32-bit PNG, under 1 MB).
          node -e "require('sharp')('assets/icon-only.png').resize(512,512).png().toFile('$IMG/icon.png')"
          # Fail the release rather than silently publish a placeholder icon.
          test -s "$IMG/icon.png"

      - name: Build${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && ' (dry run)' || ' & upload to Play internal track' }}
        working-directory: apps/mobile
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          # The ANDROID_UPLOAD_KEYSTORE secret is exposed as ANDROID_KEYSTORE, the name the build
          # step reads; the preflight's error message must keep the Settings secret name. Do not
          # rename either.
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'true' || 'false' }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          # Remove the decoded keystore on ANY exit (success, build failure, or cancel).
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          if [ "$DRY_RUN" = "true" ]; then
            bundle exec fastlane android build
          else
            bundle exec fastlane android internal
          fi

      - name: Record artifact provenance
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          AAB=apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          {
            echo "### Android build"
            echo "- version: $VERSION ($BUILD)"
            echo "- sha256: $(sha256sum "$AAB" | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aab artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: how2vote-android-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30

  # The APK F-Droid verifies against. Built in its own job from a clean checkout: the build job
  # produces the `android` channel for Play, and this needs the `fdroid` channel, so sharing a
  # workspace would leave whichever ran second overwriting the other's web bundle.
  #
  # Reproduction is only possible if this is built the way the recipe is built, so the recipe's own
  # phases are executed here too (same script mobile-ci uses) rather than restated.
  fdroid-apk:
    name: F-Droid APK (signed, reproducible)
    needs: build
    if: ${{ !inputs.dry_run }}
    environment:
      name: fdroid-signing
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # deliberately NOT write: this job holds the signing key, the next one publishes
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.build.outputs.commit }}

      - name: Check F-Droid signing secrets are configured
        env:
          FDROID_KEYSTORE: ${{ secrets.FDROID_KEYSTORE }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for key in FDROID_KEYSTORE FDROID_KEYSTORE_PASSWORD FDROID_KEY_ALIAS FDROID_KEY_PASSWORD; do
            [ -n "${!key-}" ] || missing+=("$key")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::F-Droid signing secrets missing: ${missing[*]}. Set them on the fdroid-signing environment."
            exit 1
          fi

      - run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Recipe init
        run: node scripts/fdroid-recipe-build.mjs init

      - name: Recipe prebuild
        env:
          V: ${{ needs.build.outputs.app-version }}
        run: node scripts/fdroid-recipe-build.mjs prebuild --version "$V" --code "$(node scripts/generate-app-version.mjs --code "$V")"

      - name: Recipe build
        env:
          V: ${{ needs.build.outputs.app-version }}
        run: node scripts/fdroid-recipe-build.mjs build --version "$V" --code "$(node scripts/generate-app-version.mjs --code "$V")"

      # Unsigned, exactly as the buildserver produces it — signing is a separate pass over that
      # artifact, so the pre-signature bytes are identical to theirs by construction.
      - name: Assemble the unsigned release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign, and assert the signer matches the recipe
        env:
          FDROID_KEYSTORE: ${{ secrets.FDROID_KEYSTORE }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
          V: ${{ needs.build.outputs.app-version }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/fdroid.p12"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$FDROID_KEYSTORE" | base64 -d > "$KS"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT="how2vote-fdroid-$V.apk"
          # Not re-aligned: AGP already 4-byte-aligns the stored entries, and rewriting the zip would
          # perturb the bytes F-Droid compares. Verified, not transformed.
          "$BT/zipalign" -c 4 "$UNSIGNED"
          # --alignment-preserved is REQUIRED, not tidiness: apksigner re-aligns the zip by default,
          # which shifts almost every entry and invalidates any digest computed over the original byte
          # layout — so F-Droid could never match its own build against ours.
          # v1 (JAR) signing is off: minSdk is 24, where v2 is universally supported, and v1 adds
          # ~200 KB of per-entry manifests for nothing.
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:FDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$FDROID_KEY_ALIAS" --key-pass env:FDROID_KEY_PASSWORD \
            --alignment-preserved --v1-signing-enabled false \
            --out "$OUT" "$UNSIGNED"
          "$BT/zipalign" -c 4 "$OUT"
          "$BT/apksigner" verify "$OUT"
          # The recipe pins the signers F-Droid will accept; publishing anything else is a dead end,
          # so compare before the asset is ever attached to a release.
          ACTUAL=$("$BT/apksigner" verify --print-certs "$OUT" \
            | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1 | tr 'A-Z' 'a-z')
          if ! node scripts/fdroid-recipe-build.mjs signing-keys | grep -qxF "$ACTUAL"; then
            echo "::error::signer $ACTUAL is not in the recipe's AllowedAPKSigningKeys"
            exit 1
          fi
          echo "### F-Droid APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- signer: $ACTUAL" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256: $(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      # The property F-Droid actually depends on: its signature must be copyable onto a from-source
      # build of the same tag and still verify. apksigcopier is the tool their verification uses.
      # Signing that re-writes the zip passes every other check here and fails only on their server.
      - name: Assert the signature is copyable onto the unsigned build
        env:
          V: ${{ needs.build.outputs.app-version }}
        run: |
          set -euo pipefail
          # Pinned by version AND digest: pip refuses anything whose hash differs, so a moved or
          # replaced release cannot change the tool that decides our builds are reproducible.
          # click is apksigcopier's only dependency; --require-hashes needs every one pinned.
          # Update both together, from pypi.org/pypi/<name>/json.
          cat > "$RUNNER_TEMP/apksigcopier.txt" <<'REQ'
          apksigcopier==1.1.1 --hash=sha256:0834bb7d6f3607bb0994cf8cd2e26b8f0c9d481e13b75872e0fa9cec052e519b
          click==8.4.2 --hash=sha256:e6f9f66136c816745b9d65817da91d61d957fb16e02e4dcd0552553c5a197b76
          REQ
          pip install --quiet --require-hashes -r "$RUNNER_TEMP/apksigcopier.txt"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PATH="$BT:$PATH" apksigcopier compare "how2vote-fdroid-$V.apk" \
            apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk --unsigned

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fdroid-apk-${{ needs.build.outputs.app-version }}
          path: how2vote-fdroid-${{ needs.build.outputs.app-version }}.apk
          if-no-files-found: error
          retention-days: 30

  # Separate from the signing job, and in its own environment, so the signing key and the bucket
  # credential are never held together. Publishes to R2 rather than the GitHub release: releases
  # in this repo are immutable, so assets cannot be attached after publication, and deploy.yml
  # publishes before dispatching.
  fdroid-publish:
    name: Publish the F-Droid APK
    needs: [build, fdroid-apk]
    environment:
      name: fdroid-publish
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write # record the published APK on the release commit
      actions: write # redeploy, so app-version.json advertises the release
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: fdroid-apk-${{ needs.build.outputs.app-version }}

      - name: Install rclone
        run: |
          set -euo pipefail
          VERSION=1.74.4
          SHA256=fe435e0c36228e7c2f116a8701f01127bb1f694005fc11d1f27186c8bca4115d
          curl -sSfL -o rclone.zip "https://downloads.rclone.org/v${VERSION}/rclone-v${VERSION}-linux-amd64.zip"
          echo "${SHA256}  rclone.zip" | sha256sum --check --quiet
          unzip -q -j rclone.zip "rclone-v${VERSION}-linux-amd64/rclone"
          chmod +x rclone

      - name: Upload to dist.how2vote.au
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          V: ${{ needs.build.outputs.app-version }}
        run: |
          set -euo pipefail
          APK="how2vote-fdroid-$V.apk"
          KEY="app/fdroid/$APK"
          # A published binary is never replaced: F-Droid verifies one specific build against one
          # specific file, so overwriting it would invalidate a verification that already passed.
          if ./rclone lsf "r2:how2vote-dist/app/fdroid/" 2>/dev/null | grep -qxF "$APK"; then
            echo "::error::$KEY already published — refusing to replace it"
            exit 1
          fi
          ./rclone copyto "$APK" "r2:how2vote-dist/$KEY" \
            --header-upload "Content-Type: application/vnd.android.package-archive"

      # F-Droid fetches over the public custom domain, not the S3 endpoint, so prove that path serves
      # the exact bytes that were signed before anything points a recipe at it.
      - name: Verify the published URL serves the signed bytes
        env:
          V: ${{ needs.build.outputs.app-version }}
        run: |
          set -euo pipefail
          APK="how2vote-fdroid-$V.apk"
          URL="https://dist.how2vote.au/app/fdroid/$APK"
          # The zone caches /app/* aggressively. The object was just written, so a 404 here means a
          # negative response was cached before it existed and needs purging, not a failed upload.
          if ! curl -sSfL --retry 5 --retry-delay 4 --retry-all-errors -o published.apk "$URL"; then
            echo "::error::$URL did not serve the object just uploaded — if this is a 404, purge the Cloudflare cache for that path"
            exit 1
          fi
          LOCAL=$(sha256sum "$APK" | cut -d" " -f1)
          REMOTE=$(sha256sum published.apk | cut -d" " -f1)
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::$URL serves $REMOTE, expected $LOCAL"
            exit 1
          fi
          CT=$(curl -sSI "$URL" | tr -d "\r" | sed -n "s/^content-type: //Ip")
          echo "### F-Droid APK published" >> "$GITHUB_STEP_SUMMARY"
          echo "- url: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256: $LOCAL" >> "$GITHUB_STEP_SUMMARY"
          echo "- content-type: $CT" >> "$GITHUB_STEP_SUMMARY"

      # app-version.json advertises only a release carrying this status (deploy.yml,
      # scripts/store-release-scope.mjs), so F-Droid is never told about a version before its APK
      # is served. Retried rather than left to a re-run: a re-run refuses to replace the APK above.
      # If it still fails, set it by hand with the same call once the APK URL is verified.
      - name: Record the published APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ needs.build.outputs.commit }}
          V: ${{ needs.build.outputs.app-version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            gh api -X POST "repos/$REPO/statuses/$COMMIT" -f state=success \
              -f context="fdroid-apk/v$V" -f target_url="$RUN_URL" \
              -f description="dist.how2vote.au serves how2vote-fdroid-$V.apk" >/dev/null && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not record the F-Droid APK for v$V on $COMMIT"
          exit 1

      # The scheduled deploy would catch up within six hours; this makes it prompt.
      - name: Redeploy so app-version.json advertises the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run deploy.yml --repo "$REPO" --ref main \
            || echo "::warning::could not dispatch deploy.yml — the scheduled deploy will advertise this release"

  # Cancels older runs of this workflow waiting at the play-store gate: approving one would promote
  # a stale build. After the build, so a failed build leaves the older run approvable. A run with a
  # job still executing (an F-Droid publish) is left alone; promote's track check covers it.
  supersede:
    name: Cancel older gated runs
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # cancel the older runs
    steps:
      - name: Checkout the release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: .release-tools
          sparse-checkout: scripts
          filter: tree:0

      - name: Cancel older runs waiting at the gate
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: android-release.yml
          TAG: ${{ inputs.tag }}
        run: node .release-tools/scripts/supersede-store-runs.mjs cancel-stale

  promote:
    name: Promote to Play production
    needs: build
    # Real (non-dry-run) dispatches only. A failed `build` skips this too (the `if` deliberately
    # does not use always()). The environment carries the required-reviewer gate — a human
    # promotes every store release — and the production-release Play account.
    if: ${{ !inputs.dry_run }}
    environment: play-store
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # gh release view (rollout marker)
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.build.outputs.commit }}

      # Release tooling comes from the workflow's own commit on main, never from the tag.
      - name: Checkout the release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: .release-tools
          sparse-checkout: scripts
          filter: tree:0

      # Skips a build production already holds, or one older than a build on the internal or
      # production track (a newer release reached Play), and names the staged rollout a promotion
      # replaces. See scripts/play-promotion.mjs.
      - name: Read the production track
        id: track
        env:
          BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node .release-tools/scripts/play-promotion.mjs

      # Rollout size is a release-time human decision, so it is read from the release notes at
      # PROMOTE time rather than from the trigger payload (which was captured before the reviewer
      # saw it) or a repo variable (sticky — a full rollout left switched on is the failure mode
      # this whole gate exists to prevent). The approver adds the marker, then approves; the choice
      # stays visible in the release notes afterwards. Default is staged. See
      # "Rollout policy" in docs/store-distribution.md.
      - name: Resolve rollout fraction
        id: rollout
        if: steps.track.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ format('v{0}', needs.build.outputs.app-version) }}
        run: |
          set -euo pipefail
          BODY="$(gh release view "$TAG" --json body --jq .body || echo "")"
          if printf '%s' "$BODY" | grep -qiF '[full-rollout]'; then
            echo "fraction=1" >> "$GITHUB_OUTPUT"
            echo "::warning::[full-rollout] marker present — promoting to 100% of users."
          else
            echo "fraction=0.1" >> "$GITHUB_OUTPUT"
            echo "Staged rollout: 10%. Ramp in Play Console, or halt if crash-rate regresses."
          fi

      - name: Set up Ruby / fastlane
        if: steps.track.outputs.promote == 'true'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version # single source: apps/mobile/.ruby-version
          bundler-cache: true
          working-directory: apps/mobile

      - name: Promote internal build to production
        if: steps.track.outputs.promote == 'true'
        working-directory: apps/mobile
        env:
          APP_VERSION: ${{ needs.build.outputs.app-version }}
          BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_ROLLOUT: ${{ steps.rollout.outputs.fraction }}
        run: bundle exec fastlane android promote
