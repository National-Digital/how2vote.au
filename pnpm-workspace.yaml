packages:
  - "packages/*"
  - "apps/*"
  - "tools/*"

onlyBuiltDependencies:
  - sharp
  - workerd

overrides:
  # One vite for the whole tree. vitest depends on vite directly, and left alone it resolves the
  # newest major (8, rolldown-based) for the packages that don't declare vite themselves — putting
  # Rust prebuilts (rolldown, lightningcss) back into the closure the F-Droid buildserver installs.
  # 7.x is the esbuild + rollup line, both of which F-Droid builds from source (srclibs exist).
  vite: ^7.3.6
  # auto-install-peers would otherwise inject vite's OPTIONAL lightningcss peer, and with it a
  # Rust prebuilt this repo never uses — CSS goes through vite's default postcss/esbuild path.
  "vite>lightningcss": "-"
  cookie@<0.7.0: ">=0.7.0"
  # postcss and es-module-lexer are pinned to these known-good patches as a supply-chain caution
  # (avoid auto-adopting the very newest transitive patches). NOTE: no repo-wide `minimumReleaseAge`
  # gate is enabled — with the current lockfile pnpm rejects several recently-published entries
  # (eslint, mapshaper, …), so turning it on needs the lockfile to settle or those pinned first.
  postcss: 8.5.26
  es-module-lexer: 2.3.0
  # nanoid < 3.3.17 can loop indefinitely on a negative or zero size (GHSA-28wg-ghj8-5hjv,
  # GHSA-2v37-7h3g-55p8, both high). Reached only via postcss in the dev-only vite/eslint
  # toolchain; postcss 8.5.26 already requires the patched line, and this pins it against a
  # future postcss that relaxes the range.
  nanoid@<3.3.17: ">=3.3.17"
  # GeoPackage is a format the maps toolchain never reads — it takes the AEC's shapefile — and it
  # is the sole path to image-size, whose DoS advisories (GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq,
  # both high) have NO published fix: the patched range is >= 2.0.3 and 2.0.2 is the newest release.
  # Dropping the dependency removes the vulnerable code outright, where no override could, and takes
  # file-type (GHSA-5v7r-6r5c-r473) with it. mapshaper require()s it lazily inside its GeoPackage
  # read/write paths and already guards on the module being absent, so nothing we call can reach it.
  "mapshaper>@ngageoint/geopackage": "-"
  # adm-zip < 0.6.0 lets a crafted ZIP trigger a 4GB memory allocation (GHSA-xcpc-8h2w-3j85, high).
  # Only reached transitively via mapshaper in the dev-only maps toolchain, where it unzips official
  # AEC shapefiles a maintainer fetches (never attacker-controlled input) and never ships to the
  # client. mapshaper still pins adm-zip@^0.5.9 (excludes the fix), so forced to the patched line —
  # a durable fix rather than an expiring risk acceptance (docs/legal/security-register.json).
  adm-zip@<0.6.0: ">=0.6.0"
  # fast-uri 3.x < 3.1.6 confuses the host when a backslash introduces the authority, a flaw that
  # has resurfaced after each partial fix (GHSA-v2hh-gcrm-f6hx, GHSA-7p8r-x3mc-p8w7,
  # GHSA-f65p-4m7j-42xc, GHSA-jqff-g426-hqxp, GHSA-fph4-wmhf-6fwf, GHSA-5jgf-p345-68v8, all high;
  # the last three name 3.1.5 itself). Only reached transitively via eslint-plugin-tsdoc ->
  # @microsoft/tsdoc-config -> ajv in the dev-only lint toolchain; forced to the patched line, and
  # held on 3.x because ajv requires it.
  fast-uri@>=3.0.0 <3.1.6: "3.1.6"
  # sharp < 0.35.4 inherits libvips CVEs (GHSA-f88m-g3jw-g9cj, GHSA-rgj7-g3m4-5g8c, both high).
  # The direct dependency is declared at ^0.35.4 in apps/web and apps/mobile; this forces the
  # instance pulled in via wrangler -> miniflare (dev-only Workers emulation) onto the same line.
  sharp@<0.35.4: "0.35.4"
  # brace-expansion <= 5.0.8 has an unbounded-expansion DoS — a crafted brace pattern can OOM the
  # process (GHSA-mh99-v99m-4gvg), and 5.0.9 closes the bypass of that mitigation via unbounded
  # intermediate arrays (GHSA-rgw5-rvv9-x895, both high). Reached only in dev tooling glob matching
  # (single 5.x instance in the tree), never on user input, but forced to the patched line to keep
  # the gate clean.
  brace-expansion@<5.0.9: ">=5.0.9"
  # undici 7.x < 7.29.0 can disclose one user's response to another (and crash at parse time) on
  # degenerate private cache directives (GHSA-4cwx-7wf7-3272, high). Only reached via wrangler ->
  # miniflare (dev-only Workers emulation in tools/deploy) and never in anything that ships;
  # forced to the patched line to keep the gate clean.
  undici@>=7.0.0 <7.29.0: ">=7.29.0 <8.0.0"
  # @xmldom/xmldom mishandles crafted markup — entity expansion, namespace and mutation-XSS flaws
  # that let a document parse differently than it reads (GHSA-c7q8-3ch8-vqpv, GHSA-27p8-2357-5qqv,
  # GHSA-8344-3jmq-59r6, GHSA-965w-775f-mr7g, GHSA-93r5-fhx6-vmg9, GHSA-w2rr-34g9-rvrj,
  # GHSA-4w3w-2rp5-g8jm, GHSA-x4fp-j954-r2f4 and, on 0.9, GHSA-6mj3-qw4j-hgrw, GHSA-3px3-54cx-rmw9,
  # GHSA-vr34-hp96-76pp, GHSA-g53g-w8rj-fmg7, all high). Two separate instances, neither shipped to
  # the client and neither reading attacker-controlled input:
  #   0.8.x via mapshaper, in the dev-only maps toolchain that reads official AEC shapefiles;
  #   0.9.x via @capacitor/cli -> plist, which parses the shells' own Info.plist at build time.
  # Both upstreams pin ranges that exclude the fix, so each line is forced to its own patch.
  "@xmldom/xmldom@>=0.7.0 <0.8.15": "0.8.15"
  "@xmldom/xmldom@>=0.9.0 <0.9.12": "0.9.12"

allowBuilds:
  # mapshaper optionals for formats we don't use (sqlite/msgpack); never build their natives.
  better-sqlite3: false
  # esbuild's postinstall only copies the @esbuild platform binary over its JS launcher shim; the
  # shim spawns that binary directly when the copy is skipped, so nothing is lost — and the
  # F-Droid install (--no-optional, ESBUILD_BINARY_PATH) must never materialise a prebuilt.
  esbuild: false
  msgpackr-extract: false
  sharp: true
  workerd: true
