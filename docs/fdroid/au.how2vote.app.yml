# fdroiddata recipe for au.how2vote.app — REFERENCE COPY.
#
# The authoritative copy lives in the fdroiddata repo (gitlab.com/fdroid/fdroiddata,
# metadata/au.how2vote.app.yml) once the packaging MR is merged; this file is the version we
# maintain, submit and diff against. Shape follows fdroiddata's templates/build-react-native.yml
# and the Build Metadata Reference, with fields in fdroidserver's canonical (rewritemeta) order.
# mobile-ci's `fdroid` job executes the same phases this recipe declares (init, prebuild, build,
# then `gradlew assembleRelease` with no -P flags) so a change that would break the F-Droid
# buildserver goes red on the PR that makes it, and scripts/check-fdroid-ready.mjs statically
# guards the invariants the recipe relies on. See docs/store-distribution.md § F-Droid.
#
# Toolchain: everything the build executes is installed from Debian or compiled from source, and
# the installed tree carries no prebuilt binary at all. Every native in the app closure ships as
# an npm optionalDependency (esbuild/rollup platform packages, sharp's libvips, fsevents), so
# init installs with --no-optional and none of them ever exist on the buildserver; the deploy
# toolchain (wrangler/workerd) lives in tools/deploy, outside the installed closures, for the
# same reason. The two bundler natives the build does execute are compiled from the srclibs
# pinned below — at the versions the lockfile resolves, which check-fdroid-ready.mjs holds
# equal — esbuild via ESBUILD_BINARY_PATH, rollup's parser binding installed into the one
# rollup@<version> instance path pnpm creates.
#
# Versioning: the gradle files carry NO literal version (values arrive as project properties).
# checkupdates polls https://how2vote.au/app-version.json (published on every production deploy
# by scripts/generate-app-version.mjs) for the versionName/versionCode pair and appends a build
# block below. versionCode = (MAJOR×10000 + MINOR×100 + PATCH)×1000 — the shared
# resolve-store-version encoding with the run-number digits pinned to 000, so an F-Droid build
# of a release always ranks below the Play build of the same release (different signers; the
# codes never compete within one channel).

Categories:
  - Science & Education
License: AGPL-3.0-or-later
AuthorName: National Digital
AuthorWebSite: https://how2vote.au/contact
WebSite: https://how2vote.au
SourceCode: https://github.com/National-Digital/how2vote.au
IssueTracker: https://github.com/National-Digital/how2vote.au/issues
Changelog: https://github.com/National-Digital/how2vote.au/releases

AutoName: How2Vote

RepoType: git
Repo: https://github.com/National-Digital/how2vote.au.git

Binaries: https://dist.how2vote.au/app/fdroid/how2vote-fdroid-%v.apk

Builds:
  - versionName: 1.3.16
    versionCode: 10316000
    commit: v1.3.16
    subdir: apps/mobile/android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm golang-go cargo cmake build-essential
      - npm install -g pnpm@11.12.0
    init:
      - pnpm -C ../../../.. install --frozen-lockfile --no-optional --filter @how2vote/web... --filter @how2vote/mobile
    gradle:
      - yes
    srclibs:
      - esbuild@v0.28.1
      - rollup@v4.62.4
    prebuild:
      - printf 'versionCode=$$VERCODE$$\nversionName=$$VERSION$$\n' >> ../gradle.properties
      - cargo fetch --locked --manifest-path $$rollup$$/rust/Cargo.toml
    build:
      - go build -C $$esbuild$$ ./cmd/esbuild
      - cargo build --release --offline --manifest-path $$rollup$$/rust/bindings_napi/Cargo.toml
      - install -D -m644 $$rollup$$/rust/target/release/libbindings_napi.so ../../../../node_modules/.pnpm/rollup@4.62.4/node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node
      - printf '{"name":"@rollup/rollup-linux-x64-gnu","version":"4.62.4","main":"./rollup.linux-x64-gnu.node"}' > ../../../../node_modules/.pnpm/rollup@4.62.4/node_modules/@rollup/rollup-linux-x64-gnu/package.json
      - pnpm -C ../../../.. --filter @how2vote/web^... build
      - ESBUILD_BINARY_PATH=$$esbuild$$/esbuild APP_VERSION=$$VERSION$$ PUBLIC_DIST_CHANNEL=fdroid pnpm -C ../../../.. --filter @how2vote/web build:app
      - pnpm -C ../../../.. --filter @how2vote/mobile sync:android

AllowedAPKSigningKeys: 617efd39535bb3af10ce0778b6f20ee4597f221baeb3f3e07547bfcc1ac7d213

AutoUpdateMode: Version v%v
UpdateCheckMode: HTTP
