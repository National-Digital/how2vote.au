AutoName: How2Vote

RepoType: git
Repo: https://github.com/National-Digital/how2vote.au.git

Binaries: https://dist.how2vote.au/app/fdroid/how2vote-fdroid-%v.apk

Builds:
  - versionName: 1.3.10
    versionCode: 10310000
    commit: 615f25814211dd7ce7a0667533e37a3e2fc3943d
    subdir: apps/mobile/android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
      - npm install -g pnpm@11.12.0
    init:
      - pnpm -C ../../../.. install --frozen-lockfile --filter @how2vote/web... --filter @how2vote/mobile
    gradle:
      - yes
    prebuild:
      - printf 'versionCode=$$VERCODE$$\nversionName=$$VERSION$$\n' >> ../gradle.properties
    scanignore:
      - node_modules
    build:
      - APP_VERSION=$$VERSION$$ PUBLIC_DIST_CHANNEL=fdroid pnpm -C ../../../.. --filter @how2vote/web... build
      - pnpm -C ../../../.. --filter @how2vote/mobile sync:android

