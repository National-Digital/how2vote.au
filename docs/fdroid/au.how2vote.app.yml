# fdroiddata recipe for au.how2vote.app — REFERENCE COPY.
#
# The authoritative copy lives in the fdroiddata repo (gitlab.com/fdroid/fdroiddata,
# metadata/au.how2vote.app.yml) once the packaging MR is merged; this file is the version we
# maintain, submit and diff against. mobile-ci's `fdroid` job executes the same steps this
# recipe declares (property injection via gradle.properties, web build, cap sync,
# `gradlew assembleRelease` with no -P flags) so a change that would break the F-Droid
# buildserver goes red on the PR that makes it, and scripts/check-fdroid-ready.mjs statically
# guards the invariants the recipe relies on. See docs/store-distribution.md § F-Droid.
#
# Versioning: the gradle files carry NO literal version (values arrive as project properties).
# checkupdates therefore polls https://how2vote.au/app-version.json (published on every
# production deploy by scripts/generate-app-version.mjs) for the versionName/versionCode pair,
# writes them into a new build block below (AutoUpdateMode: Version → the v<versionName> tag, or
# the hash it resolves to when a clone is available),
# and at build time the prebuild line feeds $$VERSION$$/$$VERCODE$$ back into gradle via
# gradle.properties. versionCode = (MAJOR×10000 + MINOR×100 + PATCH)×1000 — the shared
# resolve-store-version encoding with the run-number digits pinned to 000, so an F-Droid build
# of a release always ranks below the Play build of the same release (different signers; the
# codes never compete within one channel).

Categories:
  - Science & Education
License: AGPL-3.0-or-later
AuthorName: National Digital
AuthorWebSite: https://how2vote.au/contact
WebSite: https://how2vote.au
SourceCode: https://github.com/National-Digital/how2vote.au
IssueTracker: https://github.com/National-Digital/how2vote.au/issues
Changelog: https://github.com/National-Digital/how2vote.au/releases

AutoName: How2Vote

RepoType: git
Repo: https://github.com/National-Digital/how2vote.au.git

# Reproducible builds. F-Droid builds the tag itself, compares the result with the APK published
# below, and on a match publishes OURS under OUR signature rather than re-signing with its own key.
# %v is the versionName found by the update check. android-release.yml publishes exactly this object
# on every release, built through the same recipe phases so the comparison can succeed, and never
# replaces one already published. The channel is in the filename because a saved APK loses its URL
# and its signature decides whether it installs at all.
Binaries: https://dist.how2vote.au/app/fdroid/how2vote-fdroid-%v.apk
# Signer certificate digest of that APK (public). The release build asserts what it signs matches
# this, so a wrong key or alias fails the release instead of publishing something F-Droid rejects.
AllowedAPKSigningKeys: 617efd39535bb3af10ce0778b6f20ee4597f221baeb3f3e07547bfcc1ac7d213

Builds:
  # First submitted release; checkupdates appends every later release automatically with the
  # same shape.
  # commit is the full hash, not the v1.3.10 tag: a tag can be moved after review, a hash cannot.
  # Same tree either way. Keep versionName/versionCode/commit adjacent — the guard validates the
  # triple as a unit.
  - versionName: 1.3.10
    versionCode: 10310000
    commit: 615f25814211dd7ce7a0667533e37a3e2fc3943d
    subdir: apps/mobile/android
    sudo:
      # Node toolchain for the SvelteKit web bundle the shell wraps. Node major must satisfy
      # .nvmrc; pnpm version comes from corepack (packageManager field in package.json).
      - apt-get update
      - apt-get install -y --no-install-recommends curl ca-certificates
      - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
      - apt-get install -y nodejs
      - npm install -g corepack && corepack enable
    prebuild:
      # The ONLY version source for this build: the block's declared pair, injected as gradle
      # project properties (app/build.gradle reads them; -P flags are the store-CI route only).
      - printf 'versionCode=$$VERCODE$$\nversionName=$$VERSION$$\n' >> gradle.properties
      - (cd ../../.. && corepack install && pnpm install --frozen-lockfile)
    scanignore:
      # JS dependency tree for the bundled web app — installed from the committed lockfile.
      - node_modules
    build:
      # Static web bundle with the channel baked in, then Capacitor copies it into the native
      # project. Everything ships in the APK; no runtime fetch.
      #
      # `...` selects the package AND its workspace dependencies, topologically. packages/*/dist is
      # gitignored, so a fresh checkout has none of them built.
      #
      # Each command is a subshell. fdroidserver joins this list with "; " into ONE bash invocation
      # rooted at subdir, so a bare `cd` leaks into the next command.
      - (cd ../../.. && APP_VERSION=$$VERSION$$ PUBLIC_DIST_CHANNEL=fdroid pnpm --filter @how2vote/web... build)
      - (cd ../../.. && pnpm --filter @how2vote/mobile sync:android)
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk

# %v in the pattern below = the versionName found by the update check; deploy.yml tags every
# production release exactly `v<version>`, so the generated commit ref always exists.
AutoUpdateMode: Version v%v
UpdateCheckMode: HTTP
# versionCode URL | versionCode regex | versionName URL | versionName regex. Field 3 is the "."
# sentinel: apply the regex to the page already fetched. fdroidserver builds a second fetch with no
# headers (checkupdates.py check_http) and it is answered 403 at the edge, so never name a URL there.
UpdateCheckData: https://how2vote.au/app-version.json|"versionCode":\s*(\d+)|.|"versionName":\s*"([\d.]+)"
CurrentVersion: 1.3.10
CurrentVersionCode: 10310000
