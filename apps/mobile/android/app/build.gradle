apply plugin: 'com.android.application'

android {
    namespace = "au.how2vote.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "au.how2vote.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Both values arrive as gradle PROJECT PROPERTIES, which reach here two ways:
        //   - store CI: fastlane passes -PversionCode/-PversionName from resolve-store-version;
        //   - F-Droid: the fdroiddata recipe's prebuild appends both to gradle.properties from
        //     the build block's $$VERCODE$$/$$VERSION$$ (see docs/fdroid/au.how2vote.app.yml) —
        //     no CI involved, so this file must never require the -P flags.
        // The fallbacks keep local debug builds working and are never uploaded or published.
        versionCode (project.hasProperty("versionCode") ? project.property("versionCode").toInteger() : 1)
        versionName (project.hasProperty("versionName") ? project.property("versionName").toString() : "0.0.0-dev")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Upload-key signing, entirely from environment (CI decodes the keystore secret to a temp
    // path). When the env is absent — every local build — the release type simply has no signing
    // config, so nothing here blocks development and no secret ever lives in the tree. Google
    // Play re-signs with the escrowed app signing key on upload (Play App Signing).
    signingConfigs {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// The Capacitor template's conditional Google push-services block is deliberately ABSENT: the
// app has no push, and even a dormant reference fails the F-Droid inclusion scanner
// (check-fdroid-ready.mjs simulates that scan on every PR).
